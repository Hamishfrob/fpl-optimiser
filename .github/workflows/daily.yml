name: Daily data update

on:
  schedule:
    - cron: '15 6 * * *'   # every morning, UTC
    - cron: '15 14 * * *'  # and mid-afternoon, to catch injury news and new odds before evening deadlines
  workflow_dispatch: {}    # the "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install step: the solver is committed in web/vendor, and the job uses only built-in Node features.
      - name: Fetch data and work out today's advice
        run: node job/run.js
      - name: Save the new data
        run: |
          git config user.name "fpl-optimiser bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: daily update $(date -u +%F)"
          git push
